[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cache-evolve"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cache_evolve*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
